<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DevSync Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container-fluid" style="padding: 0;">
    
    <!-- Header Banner with Live User Counter -->
    <div class="alert alert-info text-center" style="margin: 10px auto; width: 90%; max-width: 900px; padding: 8px; position: relative; z-index: 1000; display: flex; justify-content: space-between; align-items: center;">
      <span><strong>Socket IO &#10084;</strong> - Realtime Board. Open <a class="linkToBoard" target="_blank" style="cursor:pointer; text-decoration: underline; font-weight: bold;">link</a> in another tab to draw.</span>
      <span id="user-count" class="badge badge-success" style="background-color: #28a745; font-size: 13px; padding: 6px 10px;">1 User Online</span>
    </div>

    <!-- Controls Toolbar -->
    <div id="controls" style="position: relative; z-index: 1000; padding: 10px; background: #222; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
      <button type="button" class="btn btn-warning btn-sm" id="pencil-button">Pencil</button>
      <button type="button" class="btn btn-warning btn-sm" id="rect-button">Rectangle</button>
      <button type="button" class="btn btn-warning btn-sm" id="circle-button">Circle</button>
      <button type="button" class="btn btn-warning btn-sm" id="ellipse-button">Ellipse</button>
      <button type="button" class="btn btn-warning btn-sm" id="line-button">Line</button>
      <button type="button" class="btn btn-warning btn-sm" id="text-button">Text</button>
      <button type="button" class="btn btn-danger btn-sm" id="clear-all">Clear All</button>

      <label for="colour-picker" style="color:#fff; margin-left: 8px; margin-right: 2px;">Colour:</label>
      <input type="color" id="colour-picker" value="#ffffff" style="width:40px; height:30px; padding:0; border:none; cursor:pointer;">

      <label for="line-width" style="color:#fff; margin-left: 8px; margin-right: 2px;">Thickness:</label>
      <span class="form-group" style="width: 70px; display: inline-block; margin:0 2px;">
        <select class="form-control input-sm" id="line-width">
          <option>2</option>
          <option selected>4</option>
          <option>6</option>
          <option>8</option>
          <option>10</option>
        </select>
      </span>

      <label for="draw-text-font-family" style="color:#fff; margin-left: 8px; margin-right: 2px;">Font:</label>
      <span class="form-group" style="width: 110px; display: inline-block; margin:0 2px;">
        <select class="form-control input-sm" id="draw-text-font-family">
          <option value="Arial">Arial</option>
          <option value="Verdana" selected>Verdana</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
      </span>

      <label for="draw-text-font-size" style="color:#fff; margin-left: 8px; margin-right: 2px;">Size:</label>
      <span class="form-group" style="width: 80px; display: inline-block; margin:0 2px;">
        <select class="form-control input-sm" id="draw-text-font-size">
          <option value="16">16px</option>
          <option value="24">24px</option>
          <option value="32" selected>32px</option>
          <option value="48">48px</option>
        </select>
      </span>

      <button type="button" class="btn btn-success btn-sm" id="download-btn" style="margin-left: 10px;">💾 Save PNG</button>
      <button type="button" class="btn btn-secondary btn-sm" id="theme-toggle-btn">🌓 Theme</button>
    </div>

    <!-- Canvas Container -->
    <div id="container" style="position: relative; width: 100vw; height: calc(100vh - 120px);">
      <canvas id="imageView" class="whiteboard" style="position: absolute; top:0; left:0; z-index:1;"></canvas>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>

  <script type="text/javascript">
    document.addEventListener("DOMContentLoaded", function(){
      var links = document.querySelectorAll('.linkToBoard');
      links.forEach(function(link) {
        link.href = window.location.href;
      });
    });
  </script>
</body>
</html>
